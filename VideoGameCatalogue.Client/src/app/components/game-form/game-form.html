<h2>{{ isEditMode ? 'Edit Game' : 'Add New Game' }}</h2>

<div class="alert alert-danger" *ngIf="errorMessage">
  {{ errorMessage }}
</div>

<form (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" class="form-control" [(ngModel)]="game.title" name="title" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Genre</label>
    <input type="text" class="form-control" [(ngModel)]="game.genre" name="genre" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Platform</label>
    <input type="text" class="form-control" [(ngModel)]="game.platform" name="platform" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Release Date</label>
    <input type="date" class="form-control" [(ngModel)]="game.releaseDate" name="releaseDate" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Price</label>
    <input type="number" class="form-control" [(ngModel)]="game.price" name="price" step="0.01" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Rating</label>
    <input type="number" class="form-control" [(ngModel)]="game.rating" name="rating" step="0.1" min="0" max="10" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" [(ngModel)]="game.description" name="description" rows="3"></textarea>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">
      {{ isEditMode ? 'Update' : 'Create' }}
    </button>
    <a class="btn btn-secondary" routerLink="/">Cancel</a>
  </div>
</form>
