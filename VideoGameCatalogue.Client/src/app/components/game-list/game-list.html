<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Browse Games</h2>
  <a class="btn btn-primary" [routerLink]="['/create']">Add New Game</a>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Genre</th>
      <th>Platform</th>
      <th>Price</th>
      <th>Rating</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (game of games; track game.id) {
        <tr>
            <td>{{ game.title }}</td>
            <td>{{ game.genre }}</td>
            <td>{{ game.platform }}</td>
            <td>{{ game.price | currency }}</td>
            <td>{{ game.rating }}</td>
            <td>
                <a class="btn btn-sm btn-outline-primary" [routerLink]="['/edit', game.id]">Edit</a>
            </td>
        </tr>
}
  </tbody>
</table>
